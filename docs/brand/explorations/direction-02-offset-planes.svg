<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">MerchantCanvas logo direction 2 — Offset planes</title>
  <desc id="desc">Two interlocking open frames suggest layered working surfaces.</desc>
  <rect width="640" height="420" fill="#F2EEE6"/>
  <path d="M64 58H278V59H64ZM64 361H576V362H64Z" fill="#D8D2C8"/>
