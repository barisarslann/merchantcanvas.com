  <text x="310" y="138" fill="#69757A" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">DIRECTION 02</text>
  <text x="310" y="183" fill="#18252F" font-family="Arial, sans-serif" font-size="42" font-weight="600">Offset planes</text>
  <text x="310" y="223" fill="#31414A" font-family="Arial, sans-serif" font-size="17">Layered operational states,</text>
